# GitHub Actions: Build iOS Fénix Pocket OS V5
# Genera IPA sin firma (para distribución Ad Hoc con Sideloadly).

name: Build iOS Fénix V5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Generate native iOS structure
        run: |
          # Si ios/ no existe, generarlo
          if [ ! -d "ios" ]; then
            echo "Regenerando andamiaje iOS..."
            flutter create --platforms ios .
          fi

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS unsigned
        run: |
          flutter build ios --release --no-codesign 2>&1 | tail -30
          ls -la build/ios/iphoneos/

      - name: Package as IPA
        run: |
          set -x
          # Estructura IPA correcta: Payload/Runner.app/...
          # CRÍTICO: 
          #   1. zip desde el PADRE de Payload/, no desde dentro
          #   2. usar `ditto` en lugar de `cp -R` (BSD no preserva bundles .app correctamente)
          echo "=== STEP 1: verifying Runner.app exists ==="
          ls -la build/ios/iphoneos/ 2>&1
          ls -la build/ios/iphoneos/Runner.app/ 2>&1 | head -20
          echo "=== STEP 2: creating Payload ==="
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          ditto Runner.app Payload/Runner.app
          echo "=== STEP 3: verify copy ==="
          ls -la Payload/Runner.app/ | head -10
          echo "=== STEP 4: zip from parent ==="
          cd ..
          pwd
          ls -la
          zip -r ../../fenix-pocket-os-v5-unsigned.ipa Payload
          echo "=== STEP 5: verify IPA ==="
          ls -la ../../fenix-pocket-os-v5-unsigned.ipa
          file ../../fenix-pocket-os-v5-unsigned.ipa
          echo "=== STEP 6: contents ==="
          unzip -l ../../fenix-pocket-os-v5-unsigned.ipa 2>&1 | head -30
          echo "=== STEP 7: sanity check ==="
          unzip -l ../../fenix-pocket-os-v5-unsigned.ipa 2>&1 | grep -q "Payload/Runner.app/Runner" && echo "✅ IPA OK" || echo "❌ IPA MAL"
          set +x

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-pocket-os-v5-unsigned
          path: fenix-pocket-os-v5-unsigned.ipa
          if-no-files-found: error
