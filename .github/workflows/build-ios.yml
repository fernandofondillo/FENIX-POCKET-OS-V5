# GitHub Actions: Build iOS Fénix Pocket OS V5
# Genera IPA sin firma (para distribución Ad Hoc con Sideloadly).

name: Build iOS Fénix V5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Generate native iOS structure
        run: |
          # Si ios/ no existe, generarlo
          if [ ! -d "ios" ]; then
            echo "Regenerando andamiaje iOS..."
            flutter create --platforms ios .
          fi

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS unsigned
        run: |
          flutter build ios --release --no-codesign 2>&1 | tail -30
          ls -la build/ios/iphoneos/

      - name: Package as IPA
        run: |
          # Estructura IPA correcta: Payload/Runner.app/...
          # CRÍTICO: 
          #   1. zip desde el PADRE de Payload/, no desde dentro
          #   2. usar `ditto` en lugar de `cp -R` (BSD no preserva bundles .app correctamente)
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          ditto Runner.app Payload/Runner.app
          cd ..
          # zip con quiet flag (-q) para evitar stderr noise
          zip -r -q ../../fenix-pocket-os-v5-unsigned.ipa Payload
          echo "---"
          ls -la ../../fenix-pocket-os-v5-unsigned.ipa
          echo "---"
          # Verificar estructura interna del IPA
          unzip -l ../../fenix-pocket-os-v5-unsigned.ipa | head -15
          echo "---"
          # Sanity check: el IPA debe contener Payload/Runner.app/Runner
          unzip -l ../../fenix-pocket-os-v5-unsigned.ipa | grep -q "Payload/Runner.app/Runner" && echo "✅ IPA OK: contiene Payload/Runner.app/Runner" || echo "❌ IPA MAL: falta Payload/Runner.app/Runner"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-pocket-os-v5-unsigned
          path: fenix-pocket-os-v5-unsigned.ipa
          if-no-files-found: error
