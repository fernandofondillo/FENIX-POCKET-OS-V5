# GitHub Actions: Build iOS Fénix Pocket OS V5
# Genera IPA sin firma (para distribución Ad Hoc con Sideloadly).
# Patrón validado V4 (workflow 27363817859) + auditoría externa 11-jun-2026.
#
# AUDITORÍA APLICADA (asesor externo, 11 jun 2026):
# 1. set -eo pipefail + tee → xcodebuild FALLA se ve en log
# 2. -derivedDataPath ../build/ios → output en lugar conocido
# 3. find . -name Runner.app → búsqueda global para diagnosticar
# 4. Validación con grep Payload/Runner.app (no /Runner) → match más amplio
# 5. Verificación de Info.plist + binario ejecutable
# 6. ditto -c -k en lugar de zip → Apple nativo, siempre disponible
# 7. Upload xcodebuild.log como artifact en if failure

name: Build iOS Fénix V5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Verify iOS structure
        run: |
          echo "=== ios/ estructura ==="
          ls -la ios/
          echo "=== Info.plist iOS target ==="
          grep IPHONEOS_DEPLOYMENT_TARGET ios/Runner.xcodeproj/project.pbxproj | head -3
          echo "=== Bundle ID ==="
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj | head -1

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: pod install (explícito)
        run: |
          # CRÍTICO: Flutter 3.44 + macos-14 a veces NO auto-ejecuta pod install
          # cuando el workspace es custom. Forzamos ejecución explícita.
          set -e
          cd ios
          pod install --repo-update
          cd ..
          echo "=== Podfile.lock generado ==="
          ls -la ios/Podfile.lock
          head -20 ios/Podfile.lock

      - name: Build iOS unsigned (xcodebuild directo)
        run: |
          # FIX auditoría #1: set -eo pipefail → errores NO se ocultan con tail
          # FIX auditoría #2: -derivedDataPath ../build/ios → output en lugar conocido
          # FIX auditoría #3: tee → log completo para debug
          set -eo pipefail
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build | tee ../xcodebuild.log
          cd ..
          echo "=== xcodebuild terminó con código $? ==="
          # Si llegamos aquí, xcodebuild fue EXITOSO
          echo "✅ xcodebuild build OK"

      - name: Verify .app was built
        run: |
          # FIX auditoría #3: buscar Runner.app GLOBALMENTE (no solo en build/ios)
          echo "=== Buscando Runner.app en TODO el repo ==="
          find . -name "Runner.app" -type d 2>/dev/null | head -5
          echo "=== Buscando específicamente en build/ios ==="
          find build/ios -name "Runner.app" -type d 2>/dev/null | head -5
          echo "=== Contenido de build/ios/ si existe ==="
          ls -la build/ios/ 2>/dev/null | head -10 || echo "no existe build/ios/"
          echo "=== Build/Products si existe ==="
          ls -la build/ios/Build/Products/ 2>/dev/null | head -10 || echo "no existe build/ios/Build/Products/"

      - name: Package as IPA (correcto, v3 con auditoría)
        run: |
          # FIX auditoría #3+5: buscar globalmente, verificar binario
          set -eo pipefail
          echo "=== Paso 1: buscar Runner.app globalmente ==="
          find . -name "Runner.app" -type d 2>/dev/null
          RUNNER_APP=$(find . -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$RUNNER_APP" ]; then
            echo "❌ No se encontró Runner.app en ningún lugar"
            exit 1
          fi
          echo "✅ Runner.app en: $RUNNER_APP"
          # Convertir a ruta absoluta
          RUNNER_APP_ABS=$(cd "$(dirname "$RUNNER_APP")" && pwd)/$(basename "$RUNNER_APP")
          echo "✅ Ruta absoluta: $RUNNER_APP_ABS"

          # FIX auditoría #5: verificar Info.plist + binario ejecutable
          echo "=== Verificación Info.plist ==="
          plutil -p "$RUNNER_APP_ABS/Info.plist" | head -20
          EXEC=$(defaults read "$RUNNER_APP_ABS/Info" CFBundleExecutable)
          echo "✅ CFBundleExecutable: $EXEC"
          ls -la "$RUNNER_APP_ABS/$EXEC"
          if [ ! -f "$RUNNER_APP_ABS/$EXEC" ]; then
            echo "❌ No se encontró el binario ejecutable $EXEC"
            exit 1
          fi
          file "$RUNNER_APP_ABS/$EXEC"

          # Estructura IPA: Payload/Runner.app/... en RAÍZ del ZIP
          echo "=== Paso 2: crear Payload/ y copiar con ditto ==="
          rm -rf Payload
          mkdir -p Payload
          # ditto preserva metadata iOS (BSD-safe, mejor que cp -R)
          ditto "$RUNNER_APP_ABS" "Payload/Runner.app"
          echo "=== Payload/Runner.app estructura ==="
          ls -la Payload/Runner.app/ | head -10
          ls -la Payload/Runner.app/$EXEC

          # FIX auditoría #6: usar ditto -c -k en lugar de zip
          # ditto es Apple nativo, siempre disponible en macOS
          echo "=== Paso 3: empaquetar IPA con ditto -c -k ==="
          ditto -c -k --sequesterRsrc --keepParent Payload fenix-pocket-os-v5-unsigned.ipa
          echo "=== Verificación final ==="
          ls -la fenix-pocket-os-v5-unsigned.ipa
          file fenix-pocket-os-v5-unsigned.ipa
          echo "=== Contenido del IPA ==="
          unzip -l fenix-pocket-os-v5-unsigned.ipa | head -15

          # FIX auditoría #4: validar con grep Payload/Runner.app (no /Runner)
          if unzip -l fenix-pocket-os-v5-unsigned.ipa | grep -q "Payload/Runner.app/"; then
            echo "✅ IPA VÁLIDO"
          else
            echo "❌ IPA MAL ARMADO — no contiene Payload/Runner.app/"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-pocket-os-v5-unsigned
          path: fenix-pocket-os-v5-unsigned.ipa
          if-no-files-found: error

      - name: Upload xcodebuild log (debug, si falló el build)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
