# GitHub Actions: Build iOS Fénix Pocket OS V5
# Genera IPA sin firma (para distribución Ad Hoc con Sideloadly).
# Patrón validado V4 (workflow 27363817859) + fix de CODE_SIGNING_ALLOWED=NO.

name: Build iOS Fénix V5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Verify iOS structure
        run: |
          echo "=== ios/ estructura ==="
          ls -la ios/
          echo "=== Info.plist iOS target ==="
          grep IPHONEOS_DEPLOYMENT_TARGET ios/Runner.xcodeproj/project.pbxproj | head -3
          echo "=== Bundle ID ==="
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj | head -1

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: pod install (explícito)
        run: |
          # CRÍTICO: Flutter 3.44 + macos-14 a veces NO auto-ejecuta pod install
          # cuando el workspace es custom. Forzamos ejecución explícita.
          cd ios
          pod install --repo-update
          cd ..
          echo "=== Podfile.lock generado ==="
          ls -la ios/Podfile.lock
          head -20 ios/Podfile.lock

      - name: Build iOS unsigned (xcodebuild directo)
        run: |
          # ESTRATEGIA: usar `xcodebuild` directo en vez de `flutter build ipa`
          # porque nos da control total sobre los flags de signing.
          # Flags CRÍTICOS:
          #   CODE_SIGNING_ALLOWED=NO        → NO intente firmar con Apple Dev team
          #   CODE_SIGN_IDENTITY=""          → sin identidad
          #   CODE_SIGNING_REQUIRED=NO       → no requiere provisioning
          #   DEVELOPMENT_TEAM=""            → sin team ID
          # Patrón validado en playbook V4 (línea 124)
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -50
          cd ..

      - name: Verify .app was built
        run: |
          echo "=== build/ios/Release-iphoneos/ ==="
          ls -la build/ios/Release-iphoneos/ 2>/dev/null || \
          echo "❌ no se generó .app en build/ios/Release-iphoneos/"
          ls -la build/ios/iphoneos/ 2>/dev/null || \
          echo "❌ no se generó .app en build/ios/iphoneos/"

      - name: Package as IPA (correcto, v2)
        run: |
          # Estrategia robusta: usar find con -print0 y rutas absolutas
          # El .app puede estar en build/ios/Release-iphoneos/Runner.app
          #                    o build/ios/iphoneos/Runner.app
          set -e
          echo "=== Buscando Runner.app ==="
          find build/ios -name "Runner.app" -type d 2>/dev/null
          RUNNER_APP=$(find build/ios -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$RUNNER_APP" ]; then
            echo "❌ No se encontró Runner.app"
            exit 1
          fi
          echo "✅ Runner.app en: $RUNNER_APP"
          # Convertir a ruta absoluta
          RUNNER_APP_ABS=$(cd "$(dirname "$RUNNER_APP")" && pwd)/$(basename "$RUNNER_APP")
          echo "✅ Ruta absoluta: $RUNNER_APP_ABS"
          # Crear Payload/ en el WORKSPACE ROOT (no dentro de build/)
          rm -rf Payload
          mkdir -p Payload
          # Copiar con ditto (BSD-safe, preserva metadata iOS)
          ditto "$RUNNER_APP_ABS" "Payload/Runner.app"
          echo "=== Payload/Runner.app estructura ==="
          ls -la Payload/Runner.app/ | head -10
          echo "=== Empaquetando IPA desde el workspace root ==="
          zip -r fenix-pocket-os-v5-unsigned.ipa Payload
          echo "=== Verificación final ==="
          ls -la fenix-pocket-os-v5-unsigned.ipa
          file fenix-pocket-os-v5-unsigned.ipa
          unzip -l fenix-pocket-os-v5-unsigned.ipa | head -15
          if unzip -l fenix-pocket-os-v5-unsigned.ipa | grep -q "Payload/Runner.app/Runner"; then
            echo "✅ IPA VÁLIDO"
          else
            echo "❌ IPA MAL ARMADO"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-pocket-os-v5-unsigned
          path: fenix-pocket-os-v5-unsigned.ipa
          if-no-files-found: error
