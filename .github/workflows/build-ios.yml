# GitHub Actions: Build iOS Fénix Pocket OS V5
# Genera IPA sin firma (para distribución Ad Hoc con Sideloadly).

name: Build iOS Fénix V5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Verify iOS structure
        run: |
          # El ios/ completo (Runner.xcworkspace, Info.plist, etc) está commiteado al repo
          # desde V4 (workflow 27363817859). NO regenerarlo con `flutter create`.
          echo "=== Verificando ios/ estructura ==="
          ls -la ios/
          ls -la ios/Runner.xcworkspace/
          cat ios/Runner/Info.plist | head -30

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS unsigned
        run: |
          # PATRÓN VALIDADO V4 (workflow 27363817859): usar `flutter build ipa --no-codesign`
          # que archiva internamente y deja IPA en build/ios/ipa/*.ipa
          # NO usar `flutter build ios --release --no-codesign` (deja .app parcial)
          flutter build ipa --no-codesign --export-options-plist=ios/ExportOptions.plist 2>&1 | tail -30
          echo "---"
          ls -la build/ios/ipa/

      - name: Copy IPA to workspace root
        run: |
          # El IPA ya está generado por `flutter build ipa`, solo copiarlo al root
          # para que upload-artifact lo encuentre
          cp build/ios/ipa/*.ipa fenix-pocket-os-v5-unsigned.ipa
          ls -la fenix-pocket-os-v5-unsigned.ipa
          # Verificar estructura interna
          file fenix-pocket-os-v5-unsigned.ipa
          unzip -l fenix-pocket-os-v5-unsigned.ipa 2>&1 | head -20
          # Sanity check
          unzip -l fenix-pocket-os-v5-unsigned.ipa 2>&1 | grep -q "Payload/Runner.app/Runner" && echo "✅ IPA OK" || echo "❌ IPA MAL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-pocket-os-v5-unsigned
          path: fenix-pocket-os-v5-unsigned.ipa
          if-no-files-found: error
